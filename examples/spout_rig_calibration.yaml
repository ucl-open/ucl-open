# SpoutRigPosition calibration - named absolute positions for the 5-axis lick spout stage.
# All values are in steps. Axes: left_elevation, right_elevation, right_radial, left_radial, base_transverse.

positions:
  home:
    left_elevation: 0
    right_elevation: 0
    right_radial: 0
    left_radial: 0
    base_transverse: 0

  both_in:
    left_elevation: 1000
    right_elevation: 1000
    right_radial: 2000
    left_radial: 2000
    base_transverse: 500

  both_out:
    left_elevation: 1000
    right_elevation: 1000
    right_radial: 1000
    left_radial: 1000
    base_transverse: 500
