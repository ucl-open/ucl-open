# HarpLickSpoutStage device settings.
# Calibration (named positions) lives in a separate spout_rig_calibration.yaml file.
#
# To change which axes are driven by which board, edit axis_mapping only -
# no Bonsai workflow changes are required.

driver_a:
  port_name: COM3
  step_interval: 250        # step interval in µs (100-20000); lower = faster
  microstep_resolution: Microstep8
  maximum_run_current: 0.5  # amps (0.0-2.0)

driver_b:
  port_name: COM4
  step_interval: 250
  microstep_resolution: Microstep8
  maximum_run_current: 0.5

axis_mapping:
  # Default: board A drives three axes, board B drives two
  left_elevation:
    board: a
    motor: 0
  right_elevation:
    board: a
    motor: 1
  right_radial:
    board: a
    motor: 2
  left_radial:
    board: b
    motor: 0
  base_transverse:
    board: b
    motor: 1
